server {
    listen 80;
    server_name _;

    # Serve the app at / (preview entry point) and at /hs-bingo/ (PWA base path)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /hs-bingo/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /hs-bingo/index.html;
    }
}
